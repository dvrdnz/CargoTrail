name: CI and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INTEGRATION_REQUIRED: "1"
      CARGO_NET_OFFLINE: "true"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Show toolchain versions
        run: |
          python --version
          cargo --version
          rustc --version
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit, process-tree, and real-Cargo integration tests
        run: python -m unittest discover -s tests -v

  test-min-python:
    # setup-python does not offer Python 3.8 on every hosted runner image, so uv
    # provides the interpreter. This backs the "CPython 3.8 or newer" claim.
    name: Tests / ${{ matrix.os }} / Python 3.8 (minimum)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INTEGRATION_REQUIRED: "1"
      CARGO_NET_OFFLINE: "true"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned uv
        run: python -m pip install uv==0.13.5
      - name: Run unit, process-tree, and real-Cargo integration tests on Python 3.8
        run: uv run --no-project --python 3.8 python -m unittest discover -s tests -v

  build-binaries:
    # Runs for version tags (release) and for manual runs (dry run, nothing is published).
    name: Build / ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: windows-2025
            target: windows-x86_64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Build one-file executable
        run: python scripts/build_binary.py --clean
      - name: Smoke-test executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./dist/cargotrail.exe --version
          else
            ./dist/cargotrail --version
          fi
          python scripts/smoke_test_binary.py
      - name: Package release asset
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python -c "import sys; sys.path.insert(0, 'scripts'); import package_release; print(package_release.project_version())")"
          fi
          python scripts/package_release.py --target "${{ matrix.target }}" --version "$version" --source-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # This job has no checkout, so gh cannot infer the repository from git remotes.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        # The release stays a draft until a maintainer has reviewed the binary-level
        # notices (see docs/releasing.md) and published it manually.
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --draft
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber
