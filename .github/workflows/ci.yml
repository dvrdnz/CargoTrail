name: CI and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INTEGRATION_REQUIRED: "1"
      CARGO_NET_OFFLINE: "true"
      CARGOTRAIL_WINDOWS_LINKER: lld
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Show toolchain versions
        run: |
          python --version
          cargo --version
          rustc --version
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit, process-tree, and real-Cargo integration tests
        run: python -m unittest discover -s tests -v

  test-min-python:
    # setup-python does not offer Python 3.8 on every hosted runner image, so uv
    # provides the interpreter. This backs the "CPython 3.8 or newer" claim.
    name: Tests / ${{ matrix.os }} / Python 3.8 (minimum)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INTEGRATION_REQUIRED: "1"
      CARGO_NET_OFFLINE: "true"
      CARGOTRAIL_WINDOWS_LINKER: lld
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned uv
        run: python -m pip install uv==0.13.5
      - name: Run unit, process-tree, and real-Cargo integration tests on Python 3.8
        run: uv run --no-project --python 3.8 python -m unittest discover -s tests -v

  windows-linker-tests:
    name: Windows Cargo linker tests / ${{ matrix.linker }}
    runs-on: windows-2025
    # Both lanes gate: the test step exits with the unittest exit code for either
    # linker. MSVC is the default Windows linker, LLD is the control lane. Only a
    # selected set of real-Cargo tests runs here (the three previously affected
    # tests plus the intentional test-failure case); the full suite runs in the
    # `test` job with LLD. Test logs and vctip.exe process snapshots are retained
    # as artifacts.
    strategy:
      fail-fast: false
      matrix:
        linker: [msvc, lld]
    env:
      CARGO_INTEGRATION_REQUIRED: "1"
      CARGO_NET_OFFLINE: "true"
      CARGOTRAIL_WINDOWS_LINKER: ${{ matrix.linker }}
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - name: Record Windows linker and vctip environment
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-diagnostics | Out-Null
          $report = @()
          $report += "linker_mode=$env:CARGOTRAIL_WINDOWS_LINKER"
          $report += "python=$((python --version 2>&1 | Out-String).Trim())"
          $report += "cargo=$((cargo --version 2>&1 | Out-String).Trim())"
          $report += "rustc=$((rustc --version --verbose 2>&1 | Out-String).Trim())"
          $report += "VCToolsInstallDir=$env:VCToolsInstallDir"
          $report += "VisualStudioVersion=$env:VisualStudioVersion"
          $report += "WindowsSDKVersion=$env:WindowsSDKVersion"
          foreach ($tool in @("link.exe", "lld-link.exe", "vctip.exe")) {
            $found = Get-Command $tool -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $report += "$tool=$($found.Source)" }
            else { $report += "$tool=<not-on-PATH>" }
          }
          $report | Set-Content -Encoding utf8 windows-diagnostics/toolchain.txt

          $processes = @()
          $queryError = $null
          try {
            $processes = @(Get-CimInstance -ClassName Win32_Process -Filter "Name = 'vctip.exe'" -ErrorAction Stop |
              Select-Object ProcessId, ParentProcessId, ExecutablePath, CreationDate)
          } catch {
            $queryError = $_.Exception.ToString()
            Write-Warning "Could not query vctip.exe before Cargo tests: $queryError"
          }
          $snapshot = [ordered]@{
            captured_at_utc = [DateTime]::UtcNow.ToString("o")
            query_succeeded = ($null -eq $queryError)
            query_error = $queryError
            count = @($processes).Count
            processes = @($processes)
          }
          $snapshotJson = ConvertTo-Json -InputObject $snapshot -Depth 5
          Set-Content -LiteralPath windows-diagnostics/vctip-before.json -Value $snapshotJson -Encoding utf8
          Get-Content -LiteralPath windows-diagnostics/toolchain.txt
          Get-Content -LiteralPath windows-diagnostics/vctip-before.json
      - name: Run the selected real-Cargo tests
        shell: pwsh
        run: |
          $tests = @(
            "tests.test_cargo_integration.RealCargoIntegrationTests.test_real_cargo_success_check_test_and_build",
            "tests.test_cargo_integration.RealCargoIntegrationTests.test_real_cargo_build_detects_workspace_change_without_changing_pipeline_status",
            "tests.test_cargo_integration.RealCargoIntegrationTests.test_real_cargo_zero_test_summary_requires_explicit_allowance",
            "tests.test_cargo_integration.RealCargoIntegrationTests.test_real_cargo_test_failure_is_failed_and_test_failure_is_observed"
          )
          & python -m unittest -v @tests 2>&1 |
            Tee-Object -FilePath windows-diagnostics/cargo-integration-tests.log
          $testExit = $LASTEXITCODE
          "test_exit_code=$testExit" | Add-Content windows-diagnostics/test-exit-code.txt
          if ($testExit -ne 0 -and $env:CARGOTRAIL_WINDOWS_LINKER -eq "msvc") {
            "MSVC diagnostic returned exit code $testExit. The MSVC test lane is gating; inspect the uploaded cargo-integration-tests.log and process snapshots." |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          exit $testExit
      - name: Record vctip state after the tests
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-diagnostics | Out-Null
          $processes = @()
          $queryError = $null
          try {
            $processes = @(Get-CimInstance -ClassName Win32_Process -Filter "Name = 'vctip.exe'" -ErrorAction Stop |
              Select-Object ProcessId, ParentProcessId, ExecutablePath, CreationDate)
          } catch {
            $queryError = $_.Exception.ToString()
            Write-Warning "Could not query vctip.exe after Cargo tests: $queryError"
          }
          $snapshot = [ordered]@{
            captured_at_utc = [DateTime]::UtcNow.ToString("o")
            query_succeeded = ($null -eq $queryError)
            query_error = $queryError
            count = @($processes).Count
            processes = @($processes)
          }
          $snapshotJson = ConvertTo-Json -InputObject $snapshot -Depth 5
          Set-Content -LiteralPath windows-diagnostics/vctip-after.json -Value $snapshotJson -Encoding utf8
          Get-Content -LiteralPath windows-diagnostics/vctip-after.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-linker-${{ matrix.linker }}-diagnostics
          path: windows-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  build-binaries:
    # Runs for version tags (release) and for manual runs (dry run, nothing is published).
    name: Build / ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, test-min-python, windows-linker-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: windows-2025
            target: windows-x86_64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned build dependency
        run: python scripts/install_build_dependencies.py
      - name: Build one-file executable
        run: python scripts/build_binary.py --clean
      - name: Smoke-test executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./dist/cargotrail.exe --version
          else
            ./dist/cargotrail --version
          fi
          python scripts/smoke_test_binary.py
      - name: Package release asset
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python -c "import sys; sys.path.insert(0, 'scripts'); import package_release; print(package_release.project_version())")"
          fi
          python scripts/package_release.py --target "${{ matrix.target }}" --version "$version" --source-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  build-termux-binary:
    name: Build / termux-aarch64
    needs: [test, test-min-python, windows-linker-tests]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare Termux workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/termux-work/source" "$RUNNER_TEMP/termux-work/release-output"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git -cf - . | tar -C "$RUNNER_TEMP/termux-work/source" -xf -
          chmod 0777 "$RUNNER_TEMP/termux-work" "$RUNNER_TEMP/termux-work/release-output"
      - name: Build and smoke-test in Termux
        shell: bash
        run: |
          docker run --rm -i \
            --security-opt seccomp=unconfined \
            --mount "type=bind,src=${RUNNER_TEMP}/termux-work,dst=/data/data/com.termux/files/usr/tmp" \
            termux/termux-docker:aarch64@sha256:45aedb5a8c0a69fb21d43132c79e6ae4bcd9b4d857213453e98825878cc47d9a \
            bash -s -- "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" <<'TERMUX'
          set -euo pipefail

          ref_type="$1"
          ref_name="$2"
          server_url="$3"
          repository="$4"

          pkg update
          pkg install -y python python-pip clang make rust

          python --version
          cargo --version
          rustc --version
          python -c 'import platform, sys; print("sys.platform:", sys.platform); print("machine:", platform.machine()); assert sys.platform == "android", "Expected Termux Python (sys.platform=android)"; assert platform.machine() == "aarch64", "Expected ARM64 Termux environment"'
          test -r "$TMPDIR/source/requirements-build.txt"
          test -w "$TMPDIR/release-output"
          python -c 'import sysconfig; from pathlib import Path; p = Path(sysconfig.get_path("data")) / "share" / "doc" / "python" / "LICENSE"; print("Python license:", p); assert p.is_file(), "Termux Python license missing: {}".format(p)'

          mkdir -p "$HOME/cargotrail"
          cp -R "$TMPDIR/source/." "$HOME/cargotrail/"
          cd "$HOME/cargotrail"

          python -m pip uninstall -y pyinstaller
          PIP_NO_BINARY=pyinstaller \
          PIP_NO_CACHE_DIR=1 \
          PIP_VERBOSE=1 \
          PYINSTALLER_COMPILE_BOOTLOADER=1 \
            python scripts/install_build_dependencies.py

          python scripts/build_binary.py --clean
          ./dist/cargotrail --version
          python scripts/smoke_test_binary.py

          if [ "$ref_type" = "tag" ]; then
            version="${ref_name#v}"
          else
            version="$(python -c "import sys; sys.path.insert(0, 'scripts'); import package_release; print(package_release.project_version())")"
          fi

          python scripts/package_release.py \
            --target termux-aarch64 \
            --version "$version" \
            --source-url "${server_url}/${repository}/tree/${ref_name}"

          cp "release/cargotrail-v${version}-termux-aarch64.tar.gz" "$TMPDIR/release-output/"
          TERMUX
      - uses: actions/upload-artifact@v7
        with:
          name: release-termux-aarch64
          path: ${{ runner.temp }}/termux-work/release-output/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-binaries, build-termux-binary]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # This job has no checkout, so gh cannot infer the repository from git remotes.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        # The release stays a draft until a maintainer has reviewed the binary-level
        # notices (see docs/releasing.md) and published it manually.
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --draft
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber
